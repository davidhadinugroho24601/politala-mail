    ####################################################################################################
    # NPM Service (Node.js for frontend build)
    ####################################################################################################
    npm:
        image: node:18
        working_dir: /app
        volumes:
            - .:/app
        ports:
            - 5173:5173
        command: ["sh", "-c", "npm install && npm run dev"]
        depends_on:
            - php


