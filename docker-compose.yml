# version: '3.8'

services:

    ####################################################################################################
    # PHP
    # ####################################################################################################

    php:
        build: .
        image: image_laravel_franken
        container_name: php
        ports:
        - "80:80"     # HTTP
        - "443:443"   # HTTPS (optional, for automatic TLS)
        volumes:
        - .:/var/www
        # - ./Caddyfile:/etc/caddy/Caddyfile
        - ./Caddyfile:/etc/frankenphp/Caddyfile
        - caddy_data:/data
        - caddy_config:/config
        environment:
        - XDG_CONFIG_HOME=/etc/frankenphp
        restart: unless-stopped
        networks:
        - default
        - loopgoods_default
        - database

