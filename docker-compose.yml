# version: '3.8'

services:

    ####################################################################################################
    # PHP
    # ####################################################################################################

    php:
        build: .
        image: image_laravel_franken
        container_name: php
        ports:
        - "80:80"     # HTTP
        - "443:443"   # HTTPS (optional, for automatic TLS)
        volumes:
        - .:/var/www
        # - ./Caddyfile:/etc/caddy/Caddyfile
        - ./Caddyfile:/etc/frankenphp/Caddyfile
        - caddy_data:/data
        - caddy_config:/config
        environment:
        - XDG_CONFIG_HOME=/etc/frankenphp
        - APP_URL=https://mail.loopgoods.org
        - GOOGLE_REDIRECT_URI=https://mail.loopgoods.org/auth/google/callback
        restart: unless-stopped
        networks:
        - default
        # - loopgoods_default
        - database



    ####################################################################################################
    # PHP
    ####################################################################################################
    ####################################################################################################
    php-nginx:
        build: .docker/php
        ports:
            - 5174:5173
        volumes:
            - .:/var/www:cached
        environment:
            - APP_URL=https://nginx.loopgoods.org
            - GOOGLE_REDIRECT_URI=https://nginx.loopgoods.org/auth/google/callback
        networks:
            - database
            - default

    ####################################################################################################
    # Nginx
    ####################################################################################################
    nginx-mail:
        image: nginx
        ports:
            - 8002:80
            - 445:443
        volumes:
            - .:/var/www
            - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - .docker/nginx/nginx.conf:/etc/nginx/nginx.conf
            - .docker/certs:/etc/nginx/certs
        depends_on:
            - php-nginx


    
volumes:
  caddy_data:
  caddy_config:

networks:

  database:
    external: true